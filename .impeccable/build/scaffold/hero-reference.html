<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: active-workout-control-ledger.png</title>
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f8f8f8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:852px">
  <div class="r-brand-mark region chrome" data-region="brand-mark"><!-- three-beat vector brand mark --></div>
  <div class="r-brand-name region text" data-region="brand-name"><!-- compact MyPersonal.App wordmark --><p style="line-height:1.05;margin:0">brand-name</p></div>
  <div class="r-workout-title region text" data-region="workout-title"><!-- contextual workout title and muscle group --><p style="line-height:1.05;margin:0">workout-title</p></div>
  <div class="r-section-progress region chrome" data-region="section-progress"><!-- thin violet progress rail --></div>
  <div class="r-exercise-name region text" data-region="exercise-name"><!-- large current exercise heading --><p style="line-height:1.05;margin:0">exercise-name</p></div>
  <div class="r-exercise-index region text" data-region="exercise-index"><!-- structural checkpoint numeral 04 --><p style="line-height:1.05;margin:0">exercise-index</p></div>
  <div class="r-series-summary region text" data-region="series-summary"><!-- current set and total sets summary --><p style="line-height:1.05;margin:0">series-summary</p></div>
  <div class="r-exercise-cue region text" data-region="exercise-cue"><!-- movement instruction --><p style="line-height:1.05;margin:0">exercise-cue</p></div>
  <div class="r-load-label region text" data-region="load-label"><!-- small load metric label --><p style="line-height:1.05;margin:0">load-label</p></div>
  <div class="r-load-value region text" data-region="load-value"><!-- large load value with kilogram unit --><p style="line-height:1.05;margin:0">load-value</p></div>
  <div class="r-repetitions-label region text" data-region="repetitions-label"><!-- small repetition metric label --><p style="line-height:1.05;margin:0">repetitions-label</p></div>
  <div class="r-repetitions-value region text" data-region="repetitions-value"><!-- large repetition count value --><p style="line-height:1.05;margin:0">repetitions-value</p></div>
  <div class="r-set-progress region control" data-region="set-progress"><!-- four labeled stops; completed, active and upcoming states: rebuild the control's chrome from the crop (comp-spec.mjs --crop set-progress); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-rest-controls region chrome" data-region="rest-controls"><!-- composite rest rail containing the countdown and two 10-second adjustment controls --></div>
  <div class="r-next-label region text" data-region="next-label"><!-- small upcoming exercise label --><p style="line-height:1.05;margin:0">next-label</p></div>
  <div class="r-next-exercise region text" data-region="next-exercise"><!-- upcoming exercise name --><p style="line-height:1.05;margin:0">next-exercise</p></div>
  <div class="r-primary-action region control" data-region="primary-action"><!-- Concluir série button: rebuild the control's chrome from the crop (comp-spec.mjs --crop primary-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-bottom-navigation region chrome" data-region="bottom-navigation"><!-- safe-area-aware student navigation --></div>
  <div class="r-workouts-nav-label region text" data-region="workouts-nav-label"><!-- active workouts navigation label --><p style="line-height:1.05;margin:0">workouts-nav-label</p></div>
  <div class="r-profile-nav-label region text" data-region="profile-nav-label"><!-- inactive profile navigation label --><p style="line-height:1.05;margin:0">profile-nav-label</p></div>
  <div class="r-contour-field region chrome" data-region="contour-field"><!-- subtle route contours; decorative and aria-hidden --></div>
</main>
</body>
</html>
